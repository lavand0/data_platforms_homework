spark.master                       yarn
spark.submit.deployMode            client
spark.yarn.jars                    __SPARK_JARS_URL__/*.jar
spark.yarn.am.memory               512m
spark.driver.memory                __SPARK_DRIVER_MEMORY__
spark.driver.extraJavaOptions      -Dfile.encoding=UTF-8
spark.executor.extraJavaOptions    -Dfile.encoding=UTF-8
spark.executor.instances           __SPARK_EXECUTORS__
spark.executor.memory              __SPARK_EXECUTOR_MEMORY__
spark.executor.cores               1
spark.sql.catalogImplementation    hive
spark.sql.warehouse.dir            __HIVE_WAREHOUSE__
spark.sql.shuffle.partitions       12
spark.ui.showConsoleProgress       false
